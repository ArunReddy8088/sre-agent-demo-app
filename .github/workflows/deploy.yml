name: Build and deploy SRE demo app

on:
  push:
    branches:
      - main
    paths:
      - "SreAgentDemoApp/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  RESOURCE_GROUP: sre-ai-poc-rg
  CONTAINER_APP_NAME: sre-agent-demo-app
  ACR_NAME: caaae124032eacr
  IMAGE_NAME: sre-agent-demo-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}/SreAgentDemoApp
          dockerfilePath: Dockerfile
          acrName: ${{ env.ACR_NAME }}
          imageToBuild: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}

      - name: Configure ingress and application port
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --set-env-vars ASPNETCORE_URLS=http://+:8080

            az containerapp ingress enable \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --type external \
              --target-port 8080 \

              --transport auto
